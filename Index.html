
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e9dfd3">
<meta name="description" content="Sixtteen Store. Muy pronto, una nueva experiencia en moda en El Carril.">
<title>Sixtteen Store | Próximamente</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: 'DM Sans', sans-serif;
  color: #211c19;
  background: #e9dfd3;
  overflow-x: hidden;
}

.page {
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 55px 22px;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 15% 15%, #f8eee4 0%, transparent 45%),
    radial-gradient(ellipse at 85% 85%, #cbb69e 0%, transparent 45%),
    linear-gradient(135deg, #eee4d9, #ded0c0);
}

.page::before {
  content: "";
  position: absolute;
  width: 500px;
  height: 500px;
  border: 1px solid rgba(151,115,77,.16);
  border-radius: 50%;
  top: -260px;
  right: -160px;
}

.page::after {
  content: "";
  position: absolute;
  width: 400px;
  height: 400px;
  border: 1px solid rgba(151,115,77,.16);
  border-radius: 50%;
  bottom: -230px;
  left: -150px;
}

.content {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 850px;
  text-align: center;
  animation: appear 1.2s ease;
}

.top-label {
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: #947657;
  margin-bottom: 38px;
  font-weight: 500;
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: clamp(65px, 12vw, 125px);
  font-weight: 500;
  letter-spacing: -5px;
  line-height: .95;
}

.logo span {
  display: block;
  font-size: .57em;
  letter-spacing: 9px;
  font-weight: 400;
  margin-top: 12px;
}

.line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin: 45px auto 35px;
}

.line::before,
.line::after {
  content: "";
  width: 85px;
  height: 1px;
  background: #ad8a65;
}

.heart {
  color: #ad8a65;
  font-size: 25px;
}

h2 {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: #947657;
  margin-bottom: 20px;
}

.description {
  font-family: 'Playfair Display', serif;
  font-size: clamp(23px, 4vw, 34px);
  line-height: 1.5;
  font-weight: 400;
}

.location {
  margin-top: 18px;
  font-size: 13px;
  letter-spacing: 2px;
  color: #786858;
}

.bottom {
  margin-top: 90px;
  font-size: 10px;
  letter-spacing: 4px;
  color: #947657;
  text-transform: uppercase;
}

/* BOTON FLOTANTE WHATSAPP */

.whatsapp-float {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 9999;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: #25D366;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  box-shadow: 0 5px 20px rgba(0,0,0,.20);
  transition: transform .3s ease, box-shadow .3s ease;
  animation: whatsappPulse 2.5s infinite;
}

.whatsapp-float:hover {
  transform: scale(1.1);
  box-shadow: 0 8px 25px rgba(0,0,0,.25);
}

.whatsapp-float svg {
  width: 34px;
  height: 34px;
  fill: white;
}

.whatsapp-label {
  position: fixed;
  right: 95px;
  bottom: 40px;
  z-index: 9998;
  background: #211c19;
  color: white;
  padding: 10px 16px;
  border-radius: 25px;
  font-size: 12px;
  letter-spacing: .5px;
  box-shadow: 0 3px 12px rgba(0,0,0,.12);
}

@keyframes whatsappPulse {
  0% { box-shadow: 0 0 0 0 rgba(37,211,102,.4), 0 5px 20px rgba(0,0,0,.2); }
  70% { box-shadow: 0 0 0 13px rgba(37,211,102,0), 0 5px 20px rgba(0,0,0,.2); }
  100% { box-shadow: 0 0 0 0 rgba(37,211,102,0), 0 5px 20px rgba(0,0,0,.2); }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media(max-width: 600px) {
  .page {
    padding: 40px 18px;
  }

  .top-label {
    margin-bottom: 32px;
    letter-spacing: 4px;
  }

  .logo {
    letter-spacing: -3px;
  }

  .line {
    margin: 35px auto 30px;
  }

  .bottom {
    margin-top: 75px;
  }

  .whatsapp-float {
    width: 58px;
    height: 58px;
    right: 17px;
    bottom: 18px;
  }

  .whatsapp-label {
    right: 85px;
    bottom: 34px;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<main class="page">

  <section class="content">

    <div class="top-label">
      Una nueva experiencia en moda
    </div>

    <div class="logo">
      Sixteen
      <span>store</span>
    </div>

    <div class="line">
      <span class="heart">♡</span>
    </div>

    <h2>Próximamente</h2>

    <p class="description">
      Tu próximo estilo<br>
      comienza acá.
    </p>

    <p class="location">
      EL CARRIL · GALERÍAS DA HONG
    </p>

    <div class="bottom">
      SIXTEEN STORE · COMING SOON
    </div>

  </section>

</main>

<!-- WHATSAPP FLOTANTE -->

  target="_blank"
  rel="noopener noreferrer"

<span class="whatsapp-label">¿Hablamos?</span>

</body>
</html>
